name: Windows build (youtube-dl.exe)

on:
  push:
    branches: [ master, main ]   # build every time source is updated on default branches
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed for attaching assets on tagged releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so tags are available when releasing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pyinstaller

          # If your project uses extra requirements, uncomment:
          # if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }

      - name: Build standalone EXE with PyInstaller
        run: |
          pyinstaller -F -n youtube-dl youtube_dl\__main__.py
        shell: pwsh

      - name: Verify artifact
        run: |
          Get-ChildItem -Recurse dist
          if (-not (Test-Path "dist/youtube-dl.exe")) { throw "Build failed: dist/youtube-dl.exe not found" }
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-dl-windows-${{ github.sha }}
          path: dist/youtube-dl.exe
          if-no-files-found: error
          retention-days: 14

      # Optional: attach to a GitHub Release when pushing a tag like v2025.08.24
      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/youtube-dl.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
